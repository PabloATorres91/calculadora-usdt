<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Calculadora USDT / ARS</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="container">
    
    <!-- CABECERA CON FLEXBOX: Título a la izq, Checkbox a la der -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div>
            <h1 style="margin-bottom: 0;">💰 USDT · ARS Calculator</h1>
            <div class="subtitle" style="border-bottom: none; padding-bottom: 0; margin-top: 5px; text-align: left;">Operaciones de compra/venta con pesos argentinos</div>
        </div>
        
        <!-- CHECKBOX A LA DERECHA -->
        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6a7e99;">
            <input type="checkbox" id="checkMostrarKraken" checked onchange="toggleKraken()">
            <label for="checkMostrarKraken">Mostrar Kraken</label>
        </div>
    </div>

    <!-- PESTAÑAS -->
    <div class="tabs">
        <button class="tab active" onclick="cargarPagina('pages/spread.html')">📊 Spread P2P</button>
        <button class="tab" onclick="cargarPagina('pages/fiwind.html')">💱 Compra USDT con USD FIWIND</button>
        <button class="tab" onclick="cargarPagina('pages/p2p_bybit_binance.html')">🔄 P2P Bybit Venta · Binance Compra</button>
        <button class="tab" id="btnKraken" onclick="cargarPagina('pages/kraken.html')">🔁 Ciclo USD/Fiwind/Kraken</button>
    </div>

    <!-- 👇 BOTÓN OPCIONAL PARA LIMPIAR DATOS 👇 -->
    <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
        <button onclick="localStorage.clear(); location.reload();" style="background: #2a3442; border: none; color: #e8edf5; padding: 6px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: 0.2s;">
            🗑️ Limpiar todos los datos guardados
        </button>
    </div>

    <!-- EL ESPACIO DONDE SE CARGARÁ EL CONTENIDO -->
    <div id="contenedor-dinamico">
        <!-- Aquí se cargará el código HTML de las páginas -->
    </div>

    <div class="footer-note">
        ⚡ Cambiá los valores y presioná "Actualizar" o <strong>Enter</strong> en cualquier campo editable.
    </div>
</div>

<script src="js/scripts.js"></script>
</body>
</html>

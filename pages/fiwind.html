<div class="section" style="border-left-color: #3b82f6;">
    <h2>📊 Parámetros del mercado <span>referencia</span></h2>
    <div class="input-row">
        <div class="input-group">
            <label>Precio USD en ARS <small>dólar referencia</small></label>
            <div class="input-wrap">
                <span class="prefix">$</span>
                <input type="number" id="usdPrice" placeholder="1495" value="1495" step="any" />
            </div>
        </div>
        <div class="input-group">
            <label>Cotización USDT en USD <small>USDT/USD</small></label>
            <div style="display: flex; gap: 10px; align-items: flex-end; width: 100%;">
                <div class="input-wrap" style="flex: 1;">
                    <span class="prefix">$</span>
                    <input type="number" id="usdtRate" placeholder="1.048" value="1.048" step="0.001" />
                </div>
                <!-- EL NUEVO BOTÓN (AHORA CON onclick) -->
                <button class="btn" onclick="window.actualizarPreciosFiwind()" style="padding: 10px 12px; font-size: 12px; white-space: nowrap;">🔄 Buscar cotización en vivo</button>
            </div>
        </div>
    </div>
</div>
